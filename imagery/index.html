<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>:o / Imagery</title>
  <link rel="stylesheet" href="../shared/project-header.css">

</head>
<body>
  <a class="skip" href="#content">Skip to images</a>
  <header data-project-header></header>
  <div class="shell">
    <aside>
      <nav aria-label="Image scenes">
        <a href="#people" aria-current="page">People and robots</a>
        <a href="#lemonade">Lemonade</a>
        <a href="#stars">Stars</a>
        <a href="#groups">Holding hands</a>
        <a href="#hordes">Hordes</a>
      </nav>
    </aside>
    <main id="content">
      <h1 id="scene-title">People and robots</h1>
      <div class="legend" aria-label="Ink roles">
        <span><i id="human-ink" aria-hidden="true" style="background:#2148B8"></i><span id="human-label">Human / Cobalt</span></span>
        <span><i id="agent-ink" aria-hidden="true" style="background:#C83232"></i><span id="agent-label">Agent / Signal Red</span></span>
      </div>
      <section id="people" data-imagery-panel data-title="People and robots" aria-label="People and robots">
        <div class="pair">
          <figure>
            <a href="assets/man-and-robot.png?v=6ab0dc4c6a3d"><img src="assets/man-and-robot.png?v=6ab0dc4c6a3d" alt="A blue man and red retro robot looking over a rocket drawing." width="1086" height="1448"></a>
            <figcaption><span>Man and robot</span><a href="assets/prompts/man-and-robot.txt">Prompt</a></figcaption>
          </figure>
          <figure>
            <a href="assets/woman-and-robot.png?v=8b8afdbc8851"><img src="assets/woman-and-robot.png?v=8b8afdbc8851" alt="A blue woman showing a folded paper shape to a red retro robot." width="1086" height="1448"></a>
            <figcaption><span>Woman and robot</span><a href="assets/prompts/woman-and-robot.txt">Prompt</a></figcaption>
          </figure>
        </div>
      </section>
      <section id="lemonade" data-imagery-panel data-title="Lemonade" aria-label="Lemonade" hidden>
        <figure class="portrait">
          <a href="assets/radio-lemonade.png?v=f9ba014959fc"><img src="assets/radio-lemonade.png?v=f9ba014959fc" alt="A red 1960s radio with arms and legs serving lemonade to a reclining blue human." width="1086" height="1448" loading="lazy"></a>
          <figcaption><span>Radio and lemonade</span><a href="assets/prompts/radio-lemonade.txt">Prompt</a></figcaption>
        </figure>
      </section>
      <section id="stars" data-imagery-panel data-title="Stars" aria-label="Stars" hidden>
        <figure class="portrait">
          <a href="assets/red-stars.png?v=735930191eca"><img src="assets/red-stars.png?v=735930191eca" alt="A blue human looking into a blue night sky filled with red stars." width="1086" height="1448" loading="lazy"></a>
          <figcaption><span>Blue sky, red stars</span><a href="assets/prompts/red-stars.txt">Prompt</a></figcaption>
        </figure>
      </section>
      <section id="groups" data-imagery-panel data-title="Holding hands" aria-label="Holding hands" hidden>
        <div class="group-grid">
          <section class="group-palette" aria-label="Cobalt / Signal Red">
            <h2>Cobalt / Signal Red</h2>
            <figure>
              <a href="assets/holding-hands-cobalt-red.png?v=09e175be6ccf"><img src="assets/holding-hands-cobalt-red.png?v=09e175be6ccf" alt="Blue people and distinct red robots holding hands and taking cheerful strides across the page." width="1672" height="941" loading="lazy"></a>
              <figcaption><span>Line</span><a href="assets/prompts/holding-hands-cobalt-red.txt">Prompt</a></figcaption>
            </figure>
            <figure>
              <a href="assets/dancing-circle-cobalt-red.png?v=ae26dd3bd47e"><img src="assets/dancing-circle-cobalt-red.png?v=ae26dd3bd47e" alt="Blue men and women holding hands with distinct red humanoid robots in a cheerful dancing circle." width="1086" height="1448" loading="lazy"></a>
              <figcaption><span>Circle</span><a href="assets/prompts/dancing-circle-cobalt-red.txt">Prompt</a></figcaption>
            </figure>
          </section>
          <section class="group-palette" aria-label="Botanical Green / Oxblood">
            <h2>Botanical Green / Oxblood</h2>
            <figure>
              <a href="assets/holding-hands-botanical-oxblood.png?v=b99bd73846dc"><img src="assets/holding-hands-botanical-oxblood.png?v=b99bd73846dc" alt="Botanical Green people and distinct Oxblood robots holding hands and taking cheerful strides across the page." width="1672" height="941" loading="lazy"></a>
              <figcaption><span>Line</span><a href="assets/prompts/holding-hands-botanical-oxblood.txt">Prompt</a></figcaption>
            </figure>
            <figure>
              <a href="assets/dancing-circle-botanical-oxblood.png?v=2097c074cc0e"><img src="assets/dancing-circle-botanical-oxblood.png?v=2097c074cc0e" alt="Botanical Green men and women holding hands with distinct Oxblood humanoid robots in a cheerful dancing circle." width="1086" height="1448" loading="lazy"></a>
              <figcaption><span>Circle</span><a href="assets/prompts/dancing-circle-botanical-oxblood.txt">Prompt</a></figcaption>
            </figure>
          </section>
          <section class="group-palette" aria-label="Ultramarine / Safety Orange">
            <h2>Ultramarine / Safety Orange</h2>
            <figure>
              <a href="assets/holding-hands-ultramarine-orange.png?v=b5bce39e3a4b"><img src="assets/holding-hands-ultramarine-orange.png?v=b5bce39e3a4b" alt="Ultramarine people and distinct Safety Orange robots holding hands and taking cheerful strides across the page." width="1672" height="941" loading="lazy"></a>
              <figcaption><span>Line</span><a href="assets/prompts/holding-hands-ultramarine-orange.txt">Prompt</a></figcaption>
            </figure>
            <figure>
              <a href="assets/dancing-circle-ultramarine-orange.png?v=e662032f3842"><img src="assets/dancing-circle-ultramarine-orange.png?v=e662032f3842" alt="Ultramarine men and women holding hands with distinct Safety Orange humanoid robots in a cheerful dancing circle." width="1086" height="1448" loading="lazy"></a>
              <figcaption><span>Circle</span><a href="assets/prompts/dancing-circle-ultramarine-orange.txt">Prompt</a></figcaption>
            </figure>
          </section>
        </div>
      </section>
      <section id="hordes" data-imagery-panel data-title="Hordes" aria-label="Hordes" hidden>
        <div class="pair">
          <figure>
            <a href="assets/horde-engineering-1.png?v=f44fa069b8e5"><img src="assets/horde-engineering-1.png?v=f44fa069b8e5" alt="A heroic 1960s engineering team of blue humans and distinct red humanoid robots, carrying tools and plans." width="1672" height="941" loading="lazy"></a>
            <figcaption><span>Engineering team 1</span><a href="assets/prompts/horde-engineering-1.txt">Prompt</a></figcaption>
          </figure>
          <figure>
            <a href="assets/horde-engineering-2.png?v=7d02d74d69e6"><img src="assets/horde-engineering-2.png?v=7d02d74d69e6" alt="A heroic 1960s engineering team of blue humans and distinct red humanoid robots, carrying tools and plans." width="1672" height="941" loading="lazy"></a>
            <figcaption><span>Engineering team 2</span><a href="assets/prompts/horde-engineering-2.txt">Prompt</a></figcaption>
          </figure>
          <figure>
            <a href="assets/horde-space-warriors-1.png?v=fbba28d30cbf"><img src="assets/horde-space-warriors-1.png?v=fbba28d30cbf" alt="Blue human space warriors and distinct red humanoid robots preparing for a mission in a 1960s sci-fi illustration." width="1672" height="941" loading="lazy"></a>
            <figcaption><span>Space crew 1</span><a href="assets/prompts/horde-space-warriors-1.txt">Prompt</a></figcaption>
          </figure>
          <figure>
            <a href="assets/horde-space-warriors-2.png?v=05692ef95427"><img src="assets/horde-space-warriors-2.png?v=05692ef95427" alt="Blue human space warriors and distinct red humanoid robots preparing for a mission in a 1960s sci-fi illustration." width="1672" height="941" loading="lazy"></a>
            <figcaption><span>Space crew 2</span><a href="assets/prompts/horde-space-warriors-2.txt">Prompt</a></figcaption>
          </figure>
        </div>
      </section>
      <p class="recipe-link"><a href="assets/manifest.json">Image recipes</a></p>
